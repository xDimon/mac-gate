# Сценарий: ноутбук, который ездит, — со всеми возможностями настроек.
#
#   - биржи всегда выходят с одного постоянного адреса, запасного нет намеренно;
#   - офисная сеть доступна по имени и адресу откуда угодно;
#   - дома (в России) заблокированные сервисы идут в основной туннель
#     с запасными, а списки скачиваются и складываются из нескольких
#     источников;
#   - в другой стране, где они тоже заблокированы, те же списки берут
#     туннели в другом порядке;
#   - за границей домашние сервисы идут в туннель к серверу дома.
#
# Настройки — разделы трёх видов в любом порядке: [[tunnel]], [[list]]
# и [[rule]]. Имя — латинские буквы, цифры, _ и -, не длиннее 64 символов,
# уникальное в своём виде. Каждый список и каждый туннель должен входить хотя
# бы в одно правило, иначе `install` откажет: то, что не берёт ни одно
# правило, скачивалось бы или держалось впустую.
#
# Пути — от этого файла и не выше него. `install` проверяет настройки, файлы
# туннелей и все источники до любых изменений, так что плохой файл
# не ломает работающую службу:
#
#   sudo mac-gate install --config examples/full-all-features.toml \
#       --awg-go <путь>/amneziawg-go --awg <путь>/awg
#
# Чего в этом файле нет, потому что это не настройка, а команда или опция
# службы (см. документацию, «Команды» и «Опции»):
#
#   sudo mac-gate country DE      задать страну вручную, поверх гео-сервисов
#   sudo mac-gate country auto    вернуться к гео-сервисам
#   sudo mac-gate killswitch on   SERVFAIL для имён всех правил
#   sudo mac-gate update          скачать URL-источники сейчас
#   --use-fakeip auto|off         отдавать ли списки роутеру, чей DNS
#                                 отвечает поддельными адресами (FakeIP)

# ---------------------------------------------------------------- туннели
#
# Туннель — имя и файл awg-quick. Порядок туннелей здесь ничего не значит:
# приоритет — это порядок внутри каждого правила. Два туннеля не могут делить
# один файл или один Address. Туннель работает, только пока он нужен
# действующему правилу.

# Постоянный публичный адрес, разрешённый в настройках API-ключей бирж.
[[tunnel]]
name = "exchange"
conf = "tunnels/exchange.conf"

# VPN-сервер офиса.
[[tunnel]]
name = "work"
conf = "tunnels/work.conf"

# Основной сервер для заблокированных сервисов и второй — у другого
# провайдера.
[[tunnel]]
name = "primary"
conf = "tunnels/primary.conf"

[[tunnel]]
name = "backup"
conf = "tunnels/backup.conf"

# Сервер в своей стране.
[[tunnel]]
name = "home"
conf = "tunnels/home.conf"

# ----------------------------------------------------------------- списки
#
# Список — имя и источники; все источники списка складываются в него.
# Источник — URL (http:// или https://) или файл ниже этого каталога.
#
#   URL   скачивается при установке и дальше раз в сутки — через туннель
#         первого действующего правила, чей туннель работает, иначе напрямую.
#         Ошибка, пустой ответ или страница, не похожая на список,
#         не принимаются: остаётся прежняя копия, повтор через час.
#   файл  перечитывается в течение секунды после изменения, без перезапуска.
#
# Формат источника описан в lists/telegram.lst. Порядок списков ничего
# не значит.

# Свои файлы: биржи, по списку на каждую.
[[list]]
name = "binance"
sources = ["lists/binance.lst"]

[[list]]
name = "kraken"
sources = ["lists/kraken.lst"]

# Свой файл с доменами и подсетью офиса.
[[list]]
name = "work"
sources = ["lists/work.lst"]

# Скачиваемые и свои источники в одном списке: общий список доменов Telegram,
# его общие подсети и свой файл, дописывающий то, чего в общих нет. Имя,
# найденное в нескольких источниках, считается один раз.
[[list]]
name = "telegram"
sources = [
  "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Services/telegram.lst",
  "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/telegram.lst",
  "lists/telegram.lst",
]

# Только скачиваемый: домены одного сервиса.
[[list]]
name = "youtube"
sources = ["https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Services/youtube.lst"]

# Только скачиваемый: домены и подсети одного сервиса.
[[list]]
name = "discord"
sources = [
  "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Services/discord.lst",
  "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/discord.lst",
]

[[list]]
name = "home-services"
sources = ["lists/home-services.lst"]

# ---------------------------------------------------------------- правила
#
# Правило уводит свои списки в свои туннели, пока выполнено его условие.
#
# when     "always"; код страны прямого адреса Mac — "RU"; или "!RU" — где
#          угодно, кроме неё. Страна — ответ большинства из трёх
#          гео-сервисов, которых спрашивают напрямую при старте, в новой сети
#          и после сна; пока ответа не было ни разу, страной считается RU.
#          Недействующее правило снимает свои маршруты и записи pf, и его
#          списки идут напрямую.
# lists    один или несколько списков; список может входить в несколько
#          правил.
# tunnels  один или несколько, по приоритету: первый — основной, остальные —
#          запасные, поднятые и проверяемые заранее.
#
# Порядок правил — тоже приоритет. Имя из списков двух правил идёт к верхнему
# действующему правилу, чей туннель работает; если такого нет — к верхнему
# действующему, и оно отвечает SERVFAIL. Адрес, уже выданный правилом выше,
# остаётся за ним, пока его туннель работает.
#
# У каждого правила свои таблицы pf, нумерация с 0 в этом порядке: пока все
# его туннели лежат, его имена получают SERVFAIL, а его адреса блокируются
# мимо его туннелей, так что из его списков напрямую ничего не утекает.

# 0. Первым, чтобы выигрывать любое пересечение: если в скачиваемый список
#    ниже когда-нибудь попадёт домен биржи, биржа всё равно выйдет
#    с постоянного адреса. Запасного нет намеренно: с другого адреса биржа
#    отвергнет API-ключи, SERVFAIL лучше.
[[rule]]
name = "exchanges"
when = "always"
lists = ["binance", "kraken"]
tunnels = ["exchange"]

# 1. Офис — откуда угодно, один сервер.
[[rule]]
name = "work"
when = "always"
lists = ["work"]
tunnels = ["work"]

# 2. Дома: заблокированные сервисы — сперва основной, потом запасной,
#    и сервер бирж на крайний случай: туннель может служить нескольким
#    правилам. Когда основной не ответил на ping, на который раньше отвечал,
#    новые соединения сразу идут в запасной, открытые остаются где были;
#    на основной — обратно, когда тот проработал 2 минуты.
[[rule]]
name = "blocked-at-home"
when = "RU"
lists = ["telegram", "youtube", "discord"]
tunnels = ["primary", "backup", "exchange"]

# 3. Те же списки в другой стране, которая их блокирует, с туннелями в другом
#    порядке: там ближе запасной сервер. Список может входить в несколько
#    правил; из этих двух одновременно действует не больше одного.
[[rule]]
name = "blocked-in-china"
when = "CN"
lists = ["telegram", "youtube", "discord"]
tunnels = ["backup", "primary"]

# 4. За границей: домашние сервисы через сервер дома, без запасного — сервер
#    в другой стране за домашний не сойдёт. Дома это правило не действует,
#    сервисы идут напрямую, домашний туннель не поднят.
[[rule]]
name = "home-services-abroad"
when = "!RU"
lists = ["home-services"]
tunnels = ["home"]
