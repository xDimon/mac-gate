# Сценарий: API-ключи криптобирж привязаны к одному IP-адресу.
#
# Биржи принимают API-ключи только с публичного адреса одного сервера. Их
# домены всегда идут в туннель к этому серверу, и запасного туннеля нет
# намеренно: запасной выходил бы с другого адреса, и биржа отвергла бы ключи.
# Когда туннель лежит, имена этих списков получают SERVFAIL, и напрямую
# ничего не уходит.

[[tunnel]]
name = "exchange"
conf = "tunnels/exchange.conf"

# Два списка в одном правиле: раздельно их можно по одному перенести
# в другое правило или убрать.
[[list]]
name = "binance"
sources = ["lists/binance.lst"]

[[list]]
name = "kraken"
sources = ["lists/kraken.lst"]

[[rule]]
name = "exchanges"
when = "always"
lists = ["binance", "kraken"]
tunnels = ["exchange"]
