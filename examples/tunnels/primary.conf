# Основной туннель: клиентский файл AmneziaWG в формате awg-quick — такой
# экспортирует приложение AmneziaVPN или печатает `awg3-server.sh add-peer`.
#
# Каждое <...> ниже — заглушка: замените её значением со своего сервера,
# в таком виде файл туннель не поднимет. Ключи — секрет: настоящий файл
# держите с правами 600; `install` копирует его от root с правами 600.
#
# Сам mac-gate читает три ключа — Address, MTU и Endpoint пира, — а все
# остальные строки как есть отдаёт `awg setconf`. DNS, Table и хуки
# PreUp/PostUp/PreDown/PostDown не действуют и перечисляются в журнале как
# conf_ignored: DNS здесь — резолвер mac-gate, маршруты — тоже его.
# Комментарий можно ставить и после значения в той же строке.

[Interface]
# Приватный ключ клиента, создаётся на Mac командой `awg genkey`; на сервер
# уходит только публичный (`awg pubkey`).
PrivateKey = <client-private-key-base64>

# Адрес этого клиента внутри туннеля — тот, что выдал сервер. Используется
# только IPv4. У двух туннелей одного файла настроек адрес не может совпадать:
# `install` откажет.
Address = 10.10.1.2/32

# Если не указан — 1280. Оставьте 1280, если сервер не требует иного:
# большее значение ломается в мобильных сетях и в части Wi-Fi.
MTU = 1280

# Мусорные пакеты перед рукопожатием: число и диапазон размера. Нужны только
# клиенту; скрипт сервера выбирает Jc 4–8, Jmin 40–89 и Jmax Jmin+50…250 —
# намного меньше MTU.
Jc = <junk-count-4-to-8>
Jmin = <junk-min-size>
Jmax = <junk-max-size>

# Дополнение пакетов рукопожатия и данных. Должно совпадать с сервером.
S1 = <padding-from-server>
S2 = <padding-from-server>
S3 = <padding-from-server>
S4 = <padding-from-server>

# Заголовки типов пакетов. Должны совпадать с сервером: одиночные числа
# меньше 2^31, не диапазоны.
H1 = <header-1-from-server>
H2 = <header-2-from-server>
H3 = <header-3-from-server>
H4 = <header-4-from-server>

# Пакет перед рукопожатием, похожий на другой трафик, — здесь на DNS-ответ.
# Нужен только клиенту; скрипт сервера делает свой для каждого пира.
I1 = <imitation-packet-from-server>

# Ключи AmneziaWG 3.1 — все из клиентского файла сервера. Ключ защиты
# заголовков — такой же секрет, как приватный ключ.
HeaderProtectionKey = <header-protection-key-from-server>
ContentPaddingAddition = <range-from-server>
RekeyAfterTime = <range-from-server>
RekeyTimeout = <range-from-server>
RejectAfterTime = <range-from-server>
KeepaliveTimeout = <range-from-server>
MaxHandshakeAttempts = <range-from-server>
RandomTrailers = on
DisableCookies = on

# В mac-gate не действует, попадает в журнал как conf_ignored.
DNS = 1.1.1.1

[Peer]
# Публичный ключ сервера и ключ, общий только для этой пары.
PublicKey = <server-public-key-base64>
PresharedKey = <preshared-key-base64>

# Принимается как есть: mac-gate уводит в туннель только домены и подсети
# списков, что бы здесь ни стояло.
AllowedIPs = 0.0.0.0/0

# Сервер: адрес или имя и его UDP-порт. Имя разрешается через DNS сети,
# а не через туннель. Пир — только один. 203.0.113.10 зарезервирован для
# документации.
Endpoint = 203.0.113.10:51820

# Поддерживает записи NAT между пакетами, в секундах.
PersistentKeepalive = 25
