# Домашний туннель: сервер в своей стране — для домашних сервисов, пока Mac
# за границей. Файл устроен как клиент AmneziaWG 2.0: самому mac-gate нужны
# только Address и Endpoint, остальное уходит в `awg setconf`. Ключи —
# заглушки; каждая строка объяснена в primary.conf.

[Interface]
PrivateKey = <client-private-key-base64>
Address = 10.10.3.2/32
Jc = <junk-count-4-to-8>
Jmin = <junk-min-size>
Jmax = <junk-max-size>
S1 = <padding-from-server>
S2 = <padding-from-server>
H1 = <header-1-from-server>
H2 = <header-2-from-server>
H3 = <header-3-from-server>
H4 = <header-4-from-server>

[Peer]
PublicKey = <server-public-key-base64>
AllowedIPs = 0.0.0.0/0
Endpoint = 198.51.100.20:51820
PersistentKeepalive = 25
