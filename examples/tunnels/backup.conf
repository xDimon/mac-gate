# Запасной туннель: второй сервер для тех же правил, поднят и проверяется
# вместе с основным. Ключи — заглушки; каждая строка объяснена
# в primary.conf.

[Interface]
PrivateKey = <client-private-key-base64>
# Адрес, отличный от всех прочих туннелей настроек.
Address = 10.10.2.2/32
MTU = 1280
Jc = <junk-count-4-to-8>
Jmin = <junk-min-size>
Jmax = <junk-max-size>
S1 = <padding-from-server>
S2 = <padding-from-server>
S3 = <padding-from-server>
S4 = <padding-from-server>
H1 = <header-1-from-server>
H2 = <header-2-from-server>
H3 = <header-3-from-server>
H4 = <header-4-from-server>
I1 = <imitation-packet-from-server>

[Peer]
PublicKey = <server-public-key-base64>
PresharedKey = <preshared-key-base64>
AllowedIPs = 0.0.0.0/0
# Имя вместо адреса: разрешается через DNS сети при каждом подключении
# туннеля, так что переехавший сервер продолжает работать.
Endpoint = vpn-backup.example.net:443
PersistentKeepalive = 25
