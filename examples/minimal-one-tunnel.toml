# Сценарий: самая маленькая рабочая установка.
#
# Один сервер, один список, всегда включено. Telegram идёт в туннель, где бы
# ни был Mac; всё остальное — напрямую. Когда туннель лежит, имена списка
# получают SERVFAIL, а pf блокирует адреса списка мимо туннеля. Подсети тоже
# блокируются — если только DNS сети не отвечает поддельными адресами (FakeIP)
# и их не забирает роутер (см. --use-fakeip в документации).
#
# Пути — от этого файла и не выше него; `install` копирует настройки и все
# названные в них файлы в /usr/local/etc/mac-gate/ с той же раскладкой:
#
#   sudo mac-gate install --config examples/minimal-one-tunnel.toml \
#       --awg-go <путь>/amneziawg-go --awg <путь>/awg

# Туннель: имя — для правил и журнала — и его файл awg-quick.
[[tunnel]]
name = "primary"
conf = "tunnels/primary.conf"

# Список: имя и источники. Файл-источник перечитывается при изменении.
[[list]]
name = "telegram"
sources = ["lists/telegram.lst"]

# Правило: какие списки в какие туннели и когда. "always" действует в любой
# стране.
[[rule]]
name = "telegram"
when = "always"
lists = ["telegram"]
tunnels = ["primary"]
