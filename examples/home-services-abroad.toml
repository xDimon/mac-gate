# Сценарий: домашние сервисы в поездке.
#
# Банк, налоговая или онлайн-кинотеатр отвечают только адресам своей страны.
# Пока Mac за границей, их домены и подсети идут в туннель к серверу дома;
# дома правило не действует — они идут напрямую, и домашний туннель
# не держится.
#
# Страна проверяется при старте, в новой сети и после сна, если последнему
# ответу больше 3 часов. В сети отеля, где гео-сервисы ошибаются, её задают
# вручную: `sudo mac-gate country DE`, а обратно к гео-сервисам —
# `sudo mac-gate country auto`.

[[tunnel]]
name = "home"
conf = "tunnels/home.conf"

[[list]]
name = "home-services"
sources = ["lists/home-services.lst"]

# "!RU": действует где угодно, кроме России. Пока гео-сервисы ни разу
# не ответили, страной считается Россия, так что правило стартует
# недействующим.
[[rule]]
name = "home-services-abroad"
when = "!RU"
lists = ["home-services"]
tunnels = ["home"]
